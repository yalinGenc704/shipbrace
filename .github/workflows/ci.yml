name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only: CI never needs to change the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # The review-history tests run against a real PostgreSQL.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: shipbrace
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shipbrace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shipbrace -d shipbrace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      # Actions pinned to exact commits, not tags that can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx oxlint .
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://shipbrace:ci-only@localhost:5432/shipbrace_test
      - run: npm run build
